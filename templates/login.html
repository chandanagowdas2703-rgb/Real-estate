{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <h1 class="h3 mb-4">Log in</h1>
  <form method="post" class="side-card" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control mb-3" required autofocus>
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control mb-3" required>
    <button class="btn btn-pine w-100">Log in</button>
  </form>
  <p class="mt-3 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
